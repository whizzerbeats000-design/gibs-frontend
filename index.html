<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIBS — Goshen International Business School</title>
    <meta
      name="description"
      content="Goshen International Business School. A contemporary business education for leaders, entrepreneurs and organizations of the Global Africa."
    />
    <meta name="theme-color" content="#006B1B" />
    <!--
      Canonical + absolute URLs (og:image, twitter:image, JSON-LD) must wait
      for the official production domain. gibs.example is a placeholder and is
      intentionally NOT emitted as canonical. Add
        <link rel="canonical" href="https://<official-domain>/" />
      and convert the image URLs below to absolute when the domain is live.
    -->

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Goshen International Business School" />
    <meta property="og:title" content="GIBS — Goshen International Business School" />
    <meta
      property="og:description"
      content="A contemporary business education for leaders, entrepreneurs and organizations of the Global Africa."
    />
    <meta property="og:image" content="/images/hero-campus.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GIBS — Goshen International Business School" />
    <meta
      name="twitter:description"
      content="A contemporary business education for leaders, entrepreneurs and organizations of the Global Africa."
    />
    <meta name="twitter:image" content="/images/hero-campus.jpg" />

    <link rel="icon" type="image/png" href="/images/gibs-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Typography system: Fraunces (variable serif — weight/optical-size axes,
      SOFT+WONK pinned at 0 for a controlled architectural reading) for the logo
      wordmark and select UI moments; Instrument Serif for display headings;
      Space Grotesk (variable grotesque) for UI, micro-type and body. Variable
      families give us the display→body optical shift and a restrained
      light→bold ramp without extra files.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Grotesk:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Goshen International Business School",
        "alternateName": "GIBS",
        "description": "A contemporary international business school educating leaders for the Global Africa.",
        "logo": "/images/gibs-logo.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
