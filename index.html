<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIBS — Goshen International Business School</title>
    <meta
      name="description"
      content="Goshen International Business School (GIBS) — 2026 Executive Training Calendar featuring 113 Local Open Programmes and 22 Foreign Executive Training Programmes across Kigali, Dubai, London, and Houston."
    />
    <meta name="theme-color" content="#006B1B" />
    <meta name="robots" content="index,follow" />

    <!--
      Canonical and og:url — deliberately a single root URL.

      This is a hash-routed SPA: every route is served the same document and the
      view is selected by the URL fragment. Search engines and social scrapers
      neither send nor follow the fragment, so the only addressable
      representation of any view is the site root. Declaring per-route canonicals
      would point at URLs that resolve to this same document and would
      misrepresent the site, so one root canonical is the accurate answer.

      Route-specific <title> and meta description are still applied at runtime by
      useSeo() in src/lib/router.tsx for in-page UX and browser history. That is
      NOT server-rendered SEO: a client that does not execute JavaScript receives
      only the static tags below.
    -->
    <link rel="canonical" href="https://www.gibs.com.ng/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Goshen International Business School (GIBS)" />
    <meta property="og:url" content="https://www.gibs.com.ng/" />
    <meta property="og:title" content="GIBS — 2026 Executive Training Calendar & International Programmes" />
    <meta
      property="og:description"
      content="113 Local Open Programmes and 22 Foreign Executive Training Programmes across Kigali, Dubai, London, and Houston. Registered with the Corporate Affairs Commission (CAC), RC 1178333."
    />
    <meta property="og:image" content="https://www.gibs.com.ng/images/gibs-hero-branded.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GIBS — 2026 Executive Training Calendar & International Programmes" />
    <meta
      name="twitter:description"
      content="113 Local Open Programmes and 22 Foreign Executive Training Programmes across Kigali, Dubai, London, and Houston."
    />
    <meta name="twitter:image" content="https://www.gibs.com.ng/images/gibs-hero-branded.jpg" />

    <link rel="icon" type="image/webp" href="/images/gibs-logo.webp" />

    <!-- Fonts are self-hosted (see the @font-face block at the top of src/index.css).
         These two faces are the ones that paint the first screen — Instrument Serif
         for the display headings, Space Grotesk for UI and body copy — so they are
         preloaded to start downloading with the HTML instead of waiting for the
         stylesheet to be parsed. crossorigin is required on a font preload even for
         same-origin files, because the fetch is made in CORS mode.

         Fraunces and Libre Baskerville are deliberately NOT preloaded: Fraunces is
         used by card titles and the footer motto (below the first screen) and
         Libre Baskerville only by the mobile-nav sheet. Letting them load on first
         use keeps them off the critical path. -->
    <link
      rel="preload"
      href="/fonts/instrument-serif-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Goshen International Business School Limited",
        "alternateName": "GIBS",
        "identifier": "RC 1178333",
        "slogan": "Take advantage of us, so that no one takes advantage of you",
        "description": "Goshen International Business School offers executive training programmes across Nigeria and four overseas hubs.",
        "url": "https://www.gibs.com.ng",
        "logo": "https://www.gibs.com.ng/images/gibs-logo.webp",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "No 81, Olorunsogo Street, Off Agbabiaka Road, Upper Gaa - Akanbi",
          "addressLocality": "Ilorin",
          "addressRegion": "Kwara State",
          "postOfficeBoxNumber": "P.O. Box 63",
          "addressCountry": "NG"
        },
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "telephone": "+234-816-001-0401",
            "contactType": "Training Desk & Programme Enquiries",
            "email": "gibsilorin@gmail.com"
          },
          {
            "@type": "ContactPoint",
            "telephone": "+234-803-342-9427",
            "contactType": "Programme Enquiries"
          }
        ],
        "knowsAbout": [
          "Executive Capacity Building",
          "Financial Management",
          "Utilities Regulation",
          "Administrative Management",
          "Telecommunications",
          "Public Sector Leadership"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
